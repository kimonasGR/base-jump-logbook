<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111218"><title>BASE Logbook</title>
<style>
:root{--bg:#101116;--panel:#191a22;--panel2:#20222d;--line:#30323e;--text:#f5f6fb;--muted:#9da2b4;--blue:#477ff5;--blue2:#263d72;--green:#55d69a;--red:#ff6b78;--radius:18px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #85a9ff;outline-offset:2px}.app{max-width:900px;margin:auto;min-height:100dvh;padding:0 16px 96px}.top{display:flex;align-items:center;justify-content:space-between;padding:24px 0 18px}.eyebrow{font-size:11px;letter-spacing:.16em;color:#a9b7dd;text-transform:uppercase}.brand{font-size:25px;font-weight:800;letter-spacing:-.04em}.brand span{color:#81a8ff}.iconbtn,.secondary,.primary,.danger{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:12px;padding:10px 13px}.primary{background:var(--blue);border-color:var(--blue);font-weight:700}.danger{color:#ffb5bb;border-color:#60343d;background:#2a1b21}.secondary{background:var(--panel)}.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.tabs{display:flex;gap:7px;overflow:auto;padding-bottom:16px}.tab{white-space:nowrap;border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--muted);padding:9px 14px}.tab.active{background:var(--blue2);border-color:#416ac5;color:white}.hero{border:1px solid #2b3d62;background:linear-gradient(125deg,#1b2438,#171922 68%);padding:20px;border-radius:22px;margin-bottom:18px}.hero h1{font-size:25px;margin:4px 0 6px;letter-spacing:-.04em}.muted{color:var(--muted)}.small{font-size:12px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:15px 0}.stat{background:#111722aa;border:1px solid #303b50;border-radius:14px;padding:12px}.stat b{display:block;font-size:22px}.stat span{font-size:11px;color:var(--muted)}.section{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:13px}.section h2{font-size:15px;margin:0 0 13px}.fieldgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{min-width:0}.field.full{grid-column:1/-1}label{display:block;font-size:12px;color:#c0c5d4;margin-bottom:6px}input,select,textarea{width:100%;background:#111219;border:1px solid #363844;border-radius:11px;color:var(--text);padding:11px 12px;min-height:43px}textarea{min-height:90px;resize:vertical}input::placeholder,textarea::placeholder{color:#696f80}.hidden{display:none!important}.pillrow{display:flex;flex-wrap:wrap;gap:7px}.pill{padding:8px 12px;border:1px solid var(--line);border-radius:999px;color:#c4c8d5;background:#111219}.pill.selected{background:var(--blue2);border-color:#5484e8;color:white}.formactions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.formactions button{flex:1}.searchrow{display:flex;gap:8px;margin-bottom:12px}.searchrow input{flex:1}.jump{border:1px solid var(--line);border-radius:15px;background:var(--panel);padding:14px;margin-bottom:9px}.jumphead{display:flex;justify-content:space-between;gap:10px}.number{color:#88aaff;font-weight:800}.jump h3{font-size:16px;margin:4px 0}.tag{display:inline-block;font-size:11px;border-radius:7px;background:#262b3b;color:#b9caff;padding:4px 7px;margin:4px 4px 0 0}.empty{text-align:center;padding:32px 15px;color:var(--muted)}.bottom{position:fixed;bottom:0;left:0;right:0;background:#121319ed;backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:10px max(14px,calc((100vw - 870px)/2)) calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:space-around;z-index:5}.bottom button{border:0;background:transparent;color:var(--muted);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 13px}.bottom button.active{color:#91b2ff}.bottom strong{font-size:19px;line-height:1}.mic{border:1px solid #395a9a;background:#1a2a49;color:#a9c5ff;border-radius:12px;padding:10px 12px;width:100%;text-align:left}.status{font-size:12px;color:var(--muted);margin-top:8px}.media-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}.media-grid img,.media-grid video{width:100%;height:100px;object-fit:cover;border-radius:10px;background:#0a0b0e}.note{background:#202131;border-radius:10px;padding:10px;color:#c7d4f7;font-size:12px}.divider{height:1px;background:var(--line);margin:14px 0}.settingsrow{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);gap:15px}.settingsrow:last-child{border-bottom:0}.coord{display:grid;grid-template-columns:1fr 1fr;gap:8px}.footerhint{font-size:11px;color:var(--muted);margin-top:8px}
@media(max-width:560px){.app{padding:0 12px 100px}.top{padding-top:18px}.fieldgrid{grid-template-columns:1fr}.field.full{grid-column:auto}.hero{padding:17px}.hero h1{font-size:23px}.stats{gap:6px}.stat{padding:10px}.stat b{font-size:19px}.section{padding:14px}.jumphead{align-items:flex-start}}
</style></head><body>
<div class="app">
<header class="top"><div><div class="eyebrow">PERSONAL JUMP RECORDS</div><div class="brand">BASE <span>LOGBOOK</span></div></div><button class="iconbtn" id="settingsTop" aria-label="Settings">⚙</button></header>
<div id="authStatus" class="muted small" style="margin:-10px 0 14px">Cloud account: checking…</div>
<div class="tabs" id="tabs"><button class="tab active" data-view="logbook">Logbook</button><button class="tab" data-view="objects">Objects</button><button class="tab" data-view="gear">Gear presets</button><button class="tab" data-view="settings">Settings</button></div>
<main id="main"></main>
</div>
<nav class="bottom"><button class="active" data-view="logbook"><strong>▤</strong>Logbook</button><button data-view="objects"><strong>⌖</strong>Objects</button><button data-view="gear"><strong>♧</strong>Gear</button><button data-view="settings"><strong>⚙</strong>Settings</button></nav>
<script>
const KEY='baseLogbookMvp.v1';
const defaults={jumps:[],objects:[],gears:[],options:{'Slider Configuration':['Slider up','Slider down','Slider off','Slick terminal'],'Pilot Chute':['42 inch','36 inch','38 inch'],'Suit':['Wingsuit','Track suit','No suit'],'Rig':[],'Jump Type':['Standard','Wingsuit','Tracking','Tandem','Other'],'Exit manoeuvre':['Stable','Front flip','Back flip','Other'],'Deployment Method':['Stowed','Hand-held','PCA','Static line','Direct bag'],'Wind strength':['Calm','Light','Moderate','Strong']},settings:{heightUnit:'m',windUnit:'m/s',timeZone:'local'}};
let db=load(),view='logbook',editing=null,objectEditing=null,gearEditing=null,query='',filterCountry='',filterType='',filterSuit='',mediaDraft=[];
function load(){try{return {...structuredClone(defaults),...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{return structuredClone(defaults)}}function persist(){localStorage.setItem(KEY,JSON.stringify(db));window.cloudSync?.()}function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function uid(){return crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random())}function nowDate(){return new Date().toISOString().slice(0,10)}function options(name){const fixed={objectType:['B','A','S','E','Other'],yesNo:['Yes','No'],yesNoNa:['Yes','No','N/A'],openingDirection:['0°','45° Left','45° Right','90° Left','90° Right','135° Left','135° Right','180°'],skyCover:['Clear','Cloudy','Precipitation','Fog'],lighting:['Sun','Shade','Night']};return fixed[name]||db.options[name]||[]}function opts(name,selected='',includeBlank=true){return (includeBlank?'<option value="">Select…</option>':'')+options(name).map(v=>`<option ${v===selected?'selected':''} value="${esc(v)}">${esc(v)}</option>`).join('')}
function field(label,name,value='',type='text',extra=''){return `<div class="field ${extra}"><label for="${name}">${label}</label><input id="${name}" name="${name}" type="${type}" value="${esc(value??'')}" /></div>`}function selectField(label,name,value='',listName=name,extra=''){return `<div class="field ${extra}"><label for="${name}">${label}</label><select id="${name}" name="${name}">${opts(listName,value)}</select></div>`}function area(label,name,value='',extra=''){return `<div class="field ${extra}"><label for="${name}">${label}</label><textarea id="${name}" name="${name}" placeholder="Optional">${esc(value||'')}</textarea></div>`}function pillGroup(label,name,values,selected){return `<div class="field full"><label>${label}</label><div class="pillrow" data-pills="${name}">${values.map(v=>`<button type="button" class="pill ${selected===v?'selected':''}" data-value="${esc(v)}">${esc(v)}</button>`).join('')}</div><input type="hidden" name="${name}" value="${esc(selected||'')}" /></div>`}
function header(title,desc,button=''){return `<div class="row between" style="margin:4px 0 14px"><div><div class="eyebrow">BASE JUMP LOGBOOK</div><h1 style="font-size:24px;margin:3px 0">${title}</h1><div class="muted small">${desc}</div></div>${button}</div>`}
function render(){document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));document.getElementById('main').innerHTML=view==='logbook'?renderLogbook():view==='objects'?renderObjects():view==='gear'?renderGear():renderSettings();bindView()}
function renderLogbook(){let total=db.jumps.length,countries=new Set(db.jumps.map(j=>j.country).filter(Boolean)).size,objects=new Set(db.jumps.map(j=>j.objectId||j.objectName).filter(Boolean)).size;let jumps=db.jumps.filter(j=>{let hay=Object.values(j).join(' ').toLowerCase();return (!query||hay.includes(query.toLowerCase()))&&(!filterCountry||j.country===filterCountry)&&(!filterType||j.objectType===filterType)&&(!filterSuit||j.suit===filterSuit)}).sort((a,b)=>(b.date||'').localeCompare(a.date||'')||b.number-a.number);return `<section class="hero"><div class="eyebrow">YOUR PERSONAL LOG</div><h1>Every jump. Every detail.</h1><div class="muted">A private record of your exits, equipment and conditions.</div><div class="stats"><div class="stat"><b>${total}</b><span>TOTAL JUMPS</span></div><div class="stat"><b>${objects}</b><span>OBJECTS</span></div><div class="stat"><b>${countries}</b><span>COUNTRIES</span></div></div><button class="primary" id="newJump">＋ Log a jump</button> <button class="secondary" id="voiceJump">🎙 Log by voice</button></section><div class="searchrow"><input id="search" placeholder="Search jumps, objects, gear…" value="${esc(query)}"><button class="secondary" id="clearFilters">Filters ↺</button></div><div class="fieldgrid" style="margin-bottom:12px"><div class="field"><select id="countryFilter"><option value="">All countries</option>${[...new Set(db.jumps.map(j=>j.country).filter(Boolean))].sort().map(c=>`<option ${filterCountry===c?'selected':''}>${esc(c)}</option>`).join('')}</select></div><div class="field"><select id="typeFilter"><option value="">All object types</option>${['B','A','S','E','Other'].map(c=>`<option ${filterType===c?'selected':''}>${c}</option>`).join('')}</select></div></div>${jumps.length?jumps.map(j=>`<article class="jump"><div class="jumphead"><div><div class="number">JUMP #${j.number}</div><h3>${esc(j.objectName||'Unnamed object')}</h3><div class="muted small">${esc([j.country,j.date,j.time].filter(Boolean).join(' · '))}</div></div><button class="secondary" data-edit-jump="${j.id}">Open ↗</button></div><div>${[j.objectType,j.jumpType,j.suit,j.height?j.height+' '+(j.heightUnit||db.settings.heightUnit):''].filter(Boolean).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>${j.privateNotes?`<div class="muted small" style="margin-top:9px">${esc(j.privateNotes.slice(0,150))}${j.privateNotes.length>150?'…':''}</div>`:''}</article>`).join(''):`<div class="section empty"><div style="font-size:28px">⌁</div><b>${total?'No matching jumps':'Your logbook starts here'}</b><p>${total?'Try changing your search or filters.':'Add your first jump or use voice logging to populate a draft.'}</p><button class="primary" id="emptyNew">＋ Log first jump</button></div>`}<div class="footerhint">Records are saved on this device in this prototype. Export regular backups from Settings.</div>`}
function jumpForm(j={}){editing=j.id||null;mediaDraft=[...(j.media||[])];let selectedObject=db.objects.find(o=>o.id===j.objectId);return `${header(j.id?'Edit jump':'Log a jump','Fields marked with * are required.','<button class="secondary" id="cancelForm">Cancel</button>')}<form id="jumpForm"><section class="section"><h2>01 · Where & when</h2><div class="fieldgrid">${field('Jump Number','number',j.number??(Math.max(0,...db.jumps.map(x=>x.number||0))+1),'number')}${field('Object name or location *','objectName',j.objectName||selectedObject?.name||'')}${field('Country','country',j.country||selectedObject?.country||'')}${field('Date','date',j.date||nowDate(),'date')}${field('Time','time',j.time||new Date().toTimeString().slice(0,5),'time')}${field('Height','height',j.height||selectedObject?.height||'','number')}${selectField('Object type *','objectType',j.objectType||selectedObject?.type||'','objectType')}${`<div class="field"><label for="heightUnit">Height unit</label><select id="heightUnit" name="heightUnit"><option value="m" ${(j.heightUnit||db.settings.heightUnit)==='m'?'selected':''}>Metres (m)</option><option value="ft" ${(j.heightUnit||db.settings.heightUnit)==='ft'?'selected':''}>Feet (ft)</option></select></div>`}<div class="field full ${j.objectType==='Other'?'':'hidden'}" id="otherTypeWrap"><label for="otherType">Specify object type *</label><input id="otherType" name="otherType" value="${esc(j.otherType||'')}" placeholder="Describe the object type"></div><div class="field full"><label>Coordinates</label><div class="coord"><input aria-label="Latitude" id="latitude" name="latitude" placeholder="Latitude" type="number" step="any" value="${esc(j.latitude??selectedObject?.latitude??'')}"><input aria-label="Longitude" id="longitude" name="longitude" placeholder="Longitude" type="number" step="any" value="${esc(j.longitude??selectedObject?.longitude??'')}"></div><div class="formactions"><button type="button" class="secondary" id="gps">◎ Use current GPS</button><button type="button" class="secondary" id="copyObject">Use saved object</button></div><div class="footerhint">Decimal degrees. GPS requires location permission and may be unavailable indoors.</div></div><div class="field full"><label for="savedObject">Link saved object</label><select id="savedObject" name="savedObject"><option value="">No saved object</option>${db.objects.map(o=>`<option value="${o.id}" ${j.objectId===o.id?'selected':''}>${esc(o.name)} · ${esc(o.country||'Country unknown')}</option>`).join('')}</select></div></div></section>
<section class="section"><h2>02 · Jump configuration</h2><div class="fieldgrid">${selectField('Slider Configuration','sliderConfiguration',j.sliderConfiguration)}${selectField('Pilot Chute','pilotChute',j.pilotChute)}${selectField('Suit','suit',j.suit)}${selectField('Summit + OSP?','summitOsp',j.summitOsp,'yesNo')}${selectField('Rig','rig',j.rig)}${selectField('Jump Type','jumpType',j.jumpType)}${selectField('Exit manoeuvre','exitManoeuvre',j.exitManoeuvre)}${selectField('Deployment method','deploymentMethod',j.deploymentMethod)}</div></section>
<section class="section"><h2>03 · Flight & deployment</h2><div class="fieldgrid">${field('Wind strength','windStrength',j.windStrength||'')}${field('Wind direction','windDirection',j.windDirection||'')}${field('Delay (seconds)','delay',j.delay||'','number')}${field('Delay for SU (seconds)','delaySu',j.delaySu||'','number')}${selectField('Opening direction','openingDirection',j.openingDirection,'openingDirection')}${selectField('Off Heading?','offHeading',j.offHeading,'yesNo')}${selectField('Correction?','correction',j.correction,'yesNoNa')}${field('Brake Setting','brakeSetting',j.brakeSetting||'')}</div></section>
<section class="section"><h2>04 · Conditions</h2><div class="fieldgrid">${selectField('Sky cover','skyCover',j.skyCover,'skyCover')}${selectField('Lighting','lighting',j.lighting,'lighting')}</div></section>
<section class="section"><h2>05 · Private notes</h2><div class="fieldgrid">${area('Private notes','privateNotes',j.privateNotes,'full')}${field('Beautiful people around','beautifulPeople',j.beautifulPeople||'','text','full')}</div><div class="divider"></div><button type="button" class="mic" id="dictateNotes">🎙 Dictate private notes</button><div class="status" id="voiceStatus">Voice recognition depends on browser and language support. Review transcription before saving.</div></section>
<section class="section"><h2>06 · Photos, videos & track</h2><div class="field"><label for="mediaFiles">Attach photos/videos</label><input id="mediaFiles" type="file" accept="image/*,video/*" multiple><div class="footerhint">For this prototype, media is stored locally with the record; large files may exceed browser storage limits.</div></div><div class="media-grid" id="mediaGrid">${mediaDraft.map((m,i)=>m.data?`<div><img src="${m.data}" alt="Attachment ${i+1}"><button type="button" class="danger" data-remove-media="${i}">Remove</button></div>`:`<div class="note">${esc(m.name)}</div>`).join('')}</div><div class="field" style="margin-top:12px"><label for="flySight">FlySight track file</label><input id="flySight" type="file" accept=".gpx,.csv,.igc,.kml,.txt"><div class="footerhint">Track attachment only in this prototype; track visualization can be added next.</div><div id="trackName" class="small muted">${esc(j.trackName||'')}</div></div></section><div class="formactions"><button class="primary" type="submit">Save jump</button><button class="secondary" type="button" id="cancelBottom">Cancel</button></div>${j.id?'<button class="danger" type="button" style="width:100%;margin-top:10px" id="deleteJump">Delete jump permanently</button>':''}</form>`}
function renderObjects(){return `${header('Saved objects','Reuse exit locations across jump records.','<button class="primary" id="newObject">＋ Add object</button>')}${objectEditing!==null?objectForm(db.objects.find(o=>o.id===objectEditing)||{}):''}${db.objects.length?db.objects.map(o=>`<article class="jump"><div class="jumphead"><div><div class="number">${esc(o.type==='Other'?o.otherType:o.type||'Object')}</div><h3>${esc(o.name)}</h3><div class="muted small">${esc([o.country,o.height?o.height+' '+o.heightUnit:(db.settings.heightUnit),o.latitude&&o.longitude?`${o.latitude}, ${o.longitude}`:''].filter(Boolean).join(' · '))}</div></div><button class="secondary" data-edit-object="${o.id}">Edit</button></div><div class="formactions"><button class="secondary" data-use-object="${o.id}">Log jump here</button><button class="danger" data-delete-object="${o.id}">Delete</button></div></article>`).join(''):'<div class="section empty">No saved objects yet. Save locations you visit often.</div>'}`}
function objectForm(o={}){return `<section class="section"><h2>${o.id?'Edit object':'New saved object'}</h2><form id="objectForm"><div class="fieldgrid">${field('Object name *','name',o.name||'')}${field('Country','country',o.country||'')}${selectField('Object type *','type',o.type,'objectType')}${field('Height','height',o.height||'','number')}${`<div class="field"><label>Height unit</label><select name="heightUnit"><option value="m" ${(o.heightUnit||db.settings.heightUnit)==='m'?'selected':''}>Metres</option><option value="ft" ${(o.heightUnit||db.settings.heightUnit)==='ft'?'selected':''}>Feet</option></select></div>`}<div class="field full ${o.type==='Other'?'':'hidden'}" id="objOtherWrap"><label>Specify object type *</label><input name="otherType" value="${esc(o.otherType||'')}"></div><div class="field full"><label>Coordinates</label><div class="coord"><input name="latitude" type="number" step="any" placeholder="Latitude" value="${esc(o.latitude??'')}"><input name="longitude" type="number" step="any" placeholder="Longitude" value="${esc(o.longitude??'')}"></div><button type="button" class="secondary" style="margin-top:8px" id="objGps">◎ Use current GPS</button></div></div><div class="formactions"><button class="primary">Save object</button><button class="secondary" type="button" id="cancelObject">Cancel</button></div></form></section>`}
function renderGear(){return `${header('Gear presets','Save reusable configurations to speed up logging.','<button class="primary" id="newGear">＋ Add preset</button>')}${gearEditing!==null?gearForm(db.gears.find(g=>g.id===gearEditing)||{}):''}${db.gears.length?db.gears.map(g=>`<article class="jump"><div class="jumphead"><div><div class="number">GEAR PRESET</div><h3>${esc(g.name)}</h3><div class="muted small">${esc([g.rig,g.suit,g.pilotChute,g.sliderConfiguration].filter(Boolean).join(' · '))}</div></div><button class="secondary" data-edit-gear="${g.id}">Edit</button></div><div class="formactions"><button class="secondary" data-apply-gear="${g.id}">Use in new jump</button><button class="danger" data-delete-gear="${g.id}">Delete</button></div></article>`).join(''):'<div class="section empty">No gear presets yet. Create one for equipment you use regularly.</div>'}`}
function gearForm(g={}){return `<section class="section"><h2>${g.id?'Edit preset':'New gear preset'}</h2><form id="gearForm"><div class="fieldgrid">${field('Preset name *','name',g.name||'')}${selectField('Rig','rig',g.rig)}${selectField('Suit','suit',g.suit)}${selectField('Pilot Chute','pilotChute',g.pilotChute)}${selectField('Slider Configuration','sliderConfiguration',g.sliderConfiguration)}</div><div class="formactions"><button class="primary">Save preset</button><button class="secondary" type="button" id="cancelGear">Cancel</button></div></form></section>`}
function renderSettings(){return `${header('Settings','Personalize the logbook and protect your data.')}<section class="section"><h2>Units & time</h2><div class="settingsrow"><div><b>Height unit</b><div class="muted small">Used for new records and objects</div></div><select id="settingHeight" style="width:130px"><option value="m" ${db.settings.heightUnit==='m'?'selected':''}>Metres</option><option value="ft" ${db.settings.heightUnit==='ft'?'selected':''}>Feet</option></select></div><div class="settingsrow"><div><b>Wind unit</b><div class="muted small">Preferred display unit</div></div><select id="settingWind" style="width:130px"><option value="m/s" ${db.settings.windUnit==='m/s'?'selected':''}>m/s</option><option value="km/h" ${db.settings.windUnit==='km/h'?'selected':''}>km/h</option><option value="knots" ${db.settings.windUnit==='knots'?'selected':''}>knots</option></select></div><div class="settingsrow"><div><b>Time zone</b><div class="muted small">Jump times are stored as entered with local context</div></div><select id="settingZone" style="width:150px"><option value="local" ${db.settings.timeZone==='local'?'selected':''}>Device local</option><option value="utc" ${db.settings.timeZone==='utc'?'selected':''}>UTC</option></select></div></section><section class="section"><h2>Custom dropdown options</h2><div class="field"><label for="optionField">Choose field</label><select id="optionField">${['Slider Configuration','Pilot Chute','Suit','Rig','Jump Type','Exit manoeuvre','Deployment Method','Wind strength'].map(n=>`<option>${n}</option>`).join('')}</select></div><div class="field" style="margin-top:10px"><label for="optionNew">Add option</label><div class="row"><input id="optionNew" placeholder="Enter new option"><button class="primary" id="addOption">Add</button></div></div><div id="optionList" style="margin-top:10px"></div></section><section class="section"><h2>Data protection & backup</h2><div class="note">This first prototype stores data in this browser on this device. It does not yet have cloud sync, encrypted server storage, or user accounts. Anyone with access to this device/browser profile may be able to access local records. Export backups regularly.</div><div class="formactions"><button class="secondary" id="exportJson">Export full backup (JSON)</button><button class="secondary" id="exportCsv">Export jumps (CSV)</button><label class="secondary" style="display:inline-flex;align-items:center;justify-content:center;cursor:pointer">Import backup <input type="file" id="importJson" accept="application/json" hidden></label></div><div class="divider"></div><button class="danger" id="eraseAll">Erase all local data</button></section><section class="section"><h2>Voice logging</h2><div class="muted small">Uses browser speech recognition when supported. Speech recognition may require internet access and may process audio through the browser's speech provider. Always review the generated draft before saving.</div><div class="footerhint">No AI service/API key is configured in this prototype; voice capture and basic field extraction are browser-based.</div></section>`}
function bindView(){document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;editing=objectEditing=gearEditing=null;render()});document.getElementById('settingsTop').onclick=()=>{view='settings';render()};if(view==='logbook')bindLogbook();if(view==='objects')bindObjects();if(view==='gear')bindGear();if(view==='settings')bindSettings()}
function bindLogbook(){const newBtn=()=>{editing=null;view='form';document.getElementById('main').innerHTML=jumpForm();bindJumpForm({})};['newJump','emptyNew','voiceJump'].forEach(id=>{let el=document.getElementById(id);if(el)el.onclick=()=>{newBtn();if(id==='voiceJump')setTimeout(startVoiceAll,150)}});let s=document.getElementById('search');if(s)s.oninput=()=>{query=s.value;let p=s.selectionStart;render();let x=document.getElementById('search');x.focus();x.setSelectionRange(p,p)};let c=document.getElementById('countryFilter');if(c)c.onchange=()=>{filterCountry=c.value;render()};let t=document.getElementById('typeFilter');if(t)t.onchange=()=>{filterType=t.value;render()};document.getElementById('clearFilters').onclick=()=>{query=filterCountry=filterType=filterSuit='';render()};document.querySelectorAll('[data-edit-jump]').forEach(b=>b.onclick=()=>{let j=db.jumps.find(x=>x.id===b.dataset.editJump);editing=j.id;view='form';document.getElementById('main').innerHTML=jumpForm(j);bindJumpForm(j)})}
function bindJumpForm(j){const form=document.getElementById('jumpForm');document.getElementById('cancelForm').onclick=document.getElementById('cancelBottom').onclick=()=>{view='logbook';editing=null;render()};const type=document.getElementById('objectType');type.onchange=()=>document.getElementById('otherTypeWrap').classList.toggle('hidden',type.value!=='Other');document.getElementById('savedObject').onchange=e=>{let o=db.objects.find(o=>o.id===e.target.value);if(o){['objectName','country','height','objectType','latitude','longitude'].forEach(k=>{let map={objectName:'name',objectType:'type'};let el=form.elements[k];if(el&&o[map[k]||k]!==undefined)el.value=o[map[k]||k]});document.getElementById('otherTypeWrap').classList.toggle('hidden',form.elements.objectType.value!=='Other')}};document.getElementById('gps').onclick=()=>{if(!navigator.geolocation)return alert('Geolocation is not available in this browser.');navigator.geolocation.getCurrentPosition(p=>{form.elements.latitude.value=p.coords.latitude.toFixed(6);form.elements.longitude.value=p.coords.longitude.toFixed(6)},e=>alert('Could not get location: '+e.message),{enableHighAccuracy:true,timeout:12000})};document.getElementById('copyObject').onclick=()=>{let o=db.objects.find(o=>o.id===form.elements.savedObject.value)||db.objects.find(o=>o.name===form.elements.objectName.value);if(!o)return alert('Select or save an object first.');form.elements.latitude.value=o.latitude||'';form.elements.longitude.value=o.longitude||''};form.querySelectorAll('[data-pills]').forEach(g=>g.querySelectorAll('button').forEach(b=>b.onclick=()=>{g.querySelectorAll('button').forEach(x=>x.classList.toggle('selected',x===b));g.parentElement.querySelector('input[type=hidden]').value=b.dataset.value}));document.getElementById('mediaFiles').onchange=async e=>{for(const f of e.target.files){if(f.size>3*1024*1024){alert(`${f.name} is over 3 MB. Large media needs a storage backend; skipping it in this prototype.`);continue}let data=await dataUrl(f);mediaDraft.push({name:f.name,type:f.type,data});}document.getElementById('mediaGrid').innerHTML=mediaDraft.map((m,i)=>`<div>${m.type.startsWith('video')?`<video src="${m.data}" controls></video>`:`<img src="${m.data}" alt="${esc(m.name)}">`}<button type="button" class="danger" data-remove-media="${i}">Remove</button></div>`).join('');bindMediaRemove()};function bindMediaRemove(){document.querySelectorAll('[data-remove-media]').forEach(b=>b.onclick=()=>{mediaDraft.splice(+b.dataset.removeMedia,1);document.getElementById('mediaGrid').innerHTML=mediaDraft.map((m,i)=>`<div>${m.type.startsWith('video')?`<video src="${m.data}" controls></video>`:`<img src="${m.data}" alt="${esc(m.name)}">`}<button type="button" class="danger" data-remove-media="${i}">Remove</button></div>`).join('');bindMediaRemove()})}bindMediaRemove();document.getElementById('flySight').onchange=e=>{document.getElementById('trackName').textContent=e.target.files[0]?.name||''};document.getElementById('dictateNotes').onclick=()=>startDictation(form.elements.privateNotes,document.getElementById('voiceStatus'));form.onsubmit=e=>{e.preventDefault();const fd=new FormData(form),d=Object.fromEntries(fd.entries());if(!d.objectName.trim())return alert('Object name or location is required.');if(!d.objectType)return alert('Choose an object type.');if(d.objectType==='Other'&&!d.otherType.trim())return alert('Please specify the object type.');let saved=db.objects.find(o=>o.id===d.savedObject);let obj={...j,...d,id:j.id||uid(),number:Number(d.number)||Math.max(0,...db.jumps.map(x=>x.number||0))+1,height:d.height?Number(d.height):'',delay:d.delay?Number(d.delay):'',delaySu:d.delaySu?Number(d.delaySu):'',latitude:d.latitude===''?'':Number(d.latitude),longitude:d.longitude===''?'':Number(d.longitude),objectId:saved?.id||'',media:mediaDraft,trackName:document.getElementById('flySight').files[0]?.name||j.trackName||''};delete obj.savedObject;if(j.id)db.jumps=db.jumps.map(x=>x.id===j.id?obj:x);else db.jumps.push(obj);if(!saved&&confirm('Save this location as a reusable object?')){db.objects.push({id:uid(),name:d.objectName,country:d.country,height:d.height,heightUnit:d.heightUnit,type:d.objectType,otherType:d.otherType,latitude:d.latitude,longitude:d.longitude})}persist();view='logbook';editing=null;render()};let del=document.getElementById('deleteJump');if(del)del.onclick=()=>{if(confirm('Permanently delete this jump? This cannot be undone.')){db.jumps=db.jumps.filter(x=>x.id!==j.id);persist();view='logbook';render()}}}
function dataUrl(file){return new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)})}
function bindObjects(){let n=document.getElementById('newObject');if(n)n.onclick=()=>{objectEditing='new';document.getElementById('main').innerHTML=header('Saved objects','Reuse exit locations')+objectForm();bindObjectForm({})};document.querySelectorAll('[data-edit-object]').forEach(b=>b.onclick=()=>{objectEditing=b.dataset.editObject;let o=db.objects.find(o=>o.id===objectEditing);document.getElementById('main').innerHTML=header('Saved objects','Edit location')+objectForm(o);bindObjectForm(o)});document.querySelectorAll('[data-delete-object]').forEach(b=>b.onclick=()=>{if(confirm('Delete this saved object? Existing jumps will remain.')){db.objects=db.objects.filter(o=>o.id!==b.dataset.deleteObject);persist();render()}});document.querySelectorAll('[data-use-object]').forEach(b=>b.onclick=()=>{let o=db.objects.find(o=>o.id===b.dataset.useObject);view='form';document.getElementById('main').innerHTML=jumpForm({objectId:o.id,objectName:o.name,country:o.country,height:o.height,objectType:o.type,otherType:o.otherType,latitude:o.latitude,longitude:o.longitude,heightUnit:o.heightUnit});bindJumpForm({objectId:o.id,objectName:o.name,country:o.country,height:o.height,objectType:o.type,otherType:o.otherType,latitude:o.latitude,longitude:o.longitude,heightUnit:o.heightUnit})})}
function bindObjectForm(o){let f=document.getElementById('objectForm');f.elements.type.onchange=()=>document.getElementById('objOtherWrap').classList.toggle('hidden',f.elements.type.value!=='Other');document.getElementById('cancelObject').onclick=()=>{objectEditing=null;render()};document.getElementById('objGps').onclick=()=>navigator.geolocation?.getCurrentPosition(p=>{f.elements.latitude.value=p.coords.latitude;f.elements.longitude.value=p.coords.longitude},e=>alert(e.message));f.onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(f));if(!d.name.trim()||!d.type)return alert('Name and object type are required.');if(d.type==='Other'&&!d.otherType.trim())return alert('Specify the object type.');let obj={...d,id:o.id||uid(),height:d.height?Number(d.height):'',latitude:d.latitude?Number(d.latitude):'',longitude:d.longitude?Number(d.longitude):''};if(o.id)db.objects=db.objects.map(x=>x.id===o.id?obj:x);else db.objects.push(obj);persist();objectEditing=null;render()}}
function bindGear(){let n=document.getElementById('newGear');if(n)n.onclick=()=>{gearEditing='new';document.getElementById('main').innerHTML=header('Gear presets','Save a reusable setup')+gearForm();bindGearForm({})};document.querySelectorAll('[data-edit-gear]').forEach(b=>b.onclick=()=>{gearEditing=b.dataset.editGear;let g=db.gears.find(g=>g.id===gearEditing);document.getElementById('main').innerHTML=header('Gear presets','Edit preset')+gearForm(g);bindGearForm(g)});document.querySelectorAll('[data-delete-gear]').forEach(b=>b.onclick=()=>{if(confirm('Delete this preset?')){db.gears=db.gears.filter(g=>g.id!==b.dataset.deleteGear);persist();render()}});document.querySelectorAll('[data-apply-gear]').forEach(b=>b.onclick=()=>{let g=db.gears.find(g=>g.id===b.dataset.applyGear);editing=null;view='form';let j={...g};delete j.id;document.getElementById('main').innerHTML=jumpForm(j);bindJumpForm(j)})}
function bindGearForm(g){let f=document.getElementById('gearForm');document.getElementById('cancelGear').onclick=()=>{gearEditing=null;render()};f.onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(f));if(!d.name.trim())return alert('Preset name is required.');let x={...d,id:g.id||uid()};if(g.id)db.gears=db.gears.map(a=>a.id===g.id?x:a);else db.gears.push(x);persist();gearEditing=null;render()}}
function bindSettings(){document.getElementById('settingHeight').onchange=e=>{db.settings.heightUnit=e.target.value;persist()};document.getElementById('settingWind').onchange=e=>{db.settings.windUnit=e.target.value;persist()};document.getElementById('settingZone').onchange=e=>{db.settings.timeZone=e.target.value;persist()};let renderOptions=()=>{let n=document.getElementById('optionField').value;document.getElementById('optionList').innerHTML=options(n).map(v=>`<div class="settingsrow"><span>${esc(v)}</span><button class="danger" data-remove-option="${esc(v)}">Remove</button></div>`).join('')||'<div class="muted small">No options saved for this field.</div>';document.querySelectorAll('[data-remove-option]').forEach(b=>b.onclick=()=>{db.options[n]=options(n).filter(x=>x!==b.dataset.removeOption);persist();renderOptions()})};document.getElementById('optionField').onchange=renderOptions;renderOptions();document.getElementById('addOption').onclick=e=>{e.preventDefault();let n=document.getElementById('optionField').value,v=document.getElementById('optionNew').value.trim();if(!v)return;if(!options(n).includes(v))db.options[n]=[...options(n),v];persist();document.getElementById('optionNew').value='';renderOptions()};document.getElementById('exportJson').onclick=()=>download('base-logbook-backup.json',JSON.stringify(db,null,2),'application/json');document.getElementById('exportCsv').onclick=()=>{let rows=db.jumps,keys=[...new Set(rows.flatMap(Object.keys))].filter(k=>k!=='media');let csv=[keys.join(','),...rows.map(r=>keys.map(k=>JSON.stringify(r[k]??'')).join(','))].join('\n');download('base-jumps.csv',csv,'text/csv')};document.getElementById('importJson').onchange=async e=>{try{let x=JSON.parse(await e.target.files[0].text());if(!Array.isArray(x.jumps)||!Array.isArray(x.objects))throw Error('Invalid backup file');if(confirm('Replace current local data with this backup?')){db={...structuredClone(defaults),...x};persist();render()}}catch(err){alert('Could not import backup: '+err.message)}};document.getElementById('eraseAll').onclick=()=>{if(confirm('Erase ALL jumps, objects, gear presets and settings from this browser?')){localStorage.removeItem(KEY);db=structuredClone(defaults);persist();render()}}}
function download(name,content,type){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type}));a.download=name;a.click();URL.revokeObjectURL(a.href)}
function startDictation(target,status){let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){status.textContent='Speech recognition is not supported in this browser. Try a supported browser or use the keyboard microphone.';return}let rec=new SR();rec.interimResults=true;rec.continuous=false;rec.lang=navigator.language||'en-US';status.textContent='Listening… speak now.';rec.onresult=e=>{let text=Array.from(e.results).map(r=>r[0].transcript).join('');target.value=(target.value?target.value+' ':'')+text};rec.onerror=e=>status.textContent='Voice recognition error: '+e.error;rec.onend=()=>{if(status)status.textContent='Transcription ready. Review and edit before saving.'};rec.start()}
function startVoiceAll(){let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){alert('Speech recognition is not supported in this browser. You can use your phone keyboard microphone, or open the app in a supported browser.');return}let prompt='Voice logging: say the jump details naturally. When you finish, the transcript will be placed in Private Notes. This prototype does not yet use an AI extraction service to map every spoken value into fields.';if(!confirm(prompt+' Continue?'))return;let f=document.getElementById('jumpForm');startDictation(f.elements.privateNotes,document.getElementById('voiceStatus'));f.elements.privateNotes.scrollIntoView({behavior:'smooth',block:'center'})}
render();
window.getLocalSnapshot=()=>({jumps:db.jumps.map(({media,...j})=>j),objects:db.objects,gears:db.gears,options:db.options,settings:db.settings});
window.setCloudSnapshot=x=>{if(!x||!Array.isArray(x.jumps)||!Array.isArray(x.objects)||!Array.isArray(x.gears))throw Error('Invalid cloud snapshot');db={...structuredClone(defaults),...x};persist();render()};

<div id="authGate" style="position:fixed;inset:0;background:#101116f5;z-index:20;display:flex;align-items:center;justify-content:center;padding:20px">
  <section class="section" style="width:min(100%,420px);padding:22px">
    <div class="eyebrow">PRIVATE CLOUD ACCOUNT</div><h1 style="font-size:24px;margin:5px 0 8px">Your BASE logbook</h1>
    <p class="muted small">Sign in to keep your jumps private and synchronized across devices.</p>
    <div class="field" style="margin:14px 0"><label for="authName">Name (for new account)</label><input id="authName" autocomplete="name" placeholder="Your name"></div>
    <div class="field" style="margin:14px 0"><label for="authEmail">Email</label><input id="authEmail" type="email" autocomplete="email" placeholder="you@example.com"></div>
    <div class="field" style="margin:14px 0"><label for="authPassword">Password</label><input id="authPassword" type="password" autocomplete="current-password" placeholder="At least 8 characters"></div>
    <button class="primary" id="authSubmit" style="width:100%">Sign in</button>
    <button class="secondary" id="authToggle" style="width:100%;margin-top:8px">Create an account</button>
    <div id="authError" class="status" role="alert"></div>
    <div class="footerhint" style="margin-top:14px">Your BASE jump records are sensitive. Use a unique password and never share your account.</div>
  </section>
</div>
<script type="module">
import { createAuthClient } from 'https://esm.sh/@neondatabase/auth';
const AUTH_URL='https://ep-young-truth-badvxgct.neonauth.c-8.eu-central-1.aws.neon.tech/neondb/auth';
const auth=createAuthClient(AUTH_URL);
const gate=document.getElementById('authGate'), errorBox=document.getElementById('authError'), submit=document.getElementById('authSubmit'), toggle=document.getElementById('authToggle'), status=document.getElementById('authStatus');
let creating=false, cloudReady=false, syncBusy=false, syncAgain=false, bearer=null;
function showError(e){errorBox.textContent=e?.message||String(e)||'Authentication failed.'}
async function getToken(){
  const r=await auth.token();
  const token=r?.data?.token||r?.token;
  if(!token)throw Error('Could not obtain a secure access token. Please sign in again.');
  return token;
}
async function api(path,opts={}){
  const response=await fetch(path,{...opts,headers:{'Content-Type':'application/json',Authorization:'Bearer '+bearer,...opts.headers}});
  const data=await response.json().catch(()=>({}));
  if(!response.ok)throw Error(data.error||'Cloud request failed ('+response.status+').');
  return data;
}
async function syncCloud(){
  if(!cloudReady||!bearer)return;
  if(syncBusy){syncAgain=true;return}
  syncBusy=true;
  try{
    const snapshot=window.getLocalSnapshot();
    await api('/api/snapshot',{method:'PUT',body:JSON.stringify(snapshot)});
    status.textContent='Cloud sync active · '+new Date().toLocaleTimeString();
  }catch(e){status.textContent='Cloud sync issue · '+e.message}
  finally{syncBusy=false;if(syncAgain){syncAgain=false;syncCloud()}}
}
window.cloudSync=()=>{if(cloudReady)syncCloud()};
async function enterApp(){
  const session=await auth.getSession();
  if(!session?.data?.user&&!session?.user)throw Error('No active session.');
  bearer=await getToken();
  await api('/api/me');
  const cloud=await api('/api/snapshot');
  if(cloud.snapshot){
    const local=window.getLocalSnapshot();
    const localHasData=local.jumps.length||local.objects.length||local.gears.length;
    if(localHasData&&!confirm('A cloud logbook already exists. Replace this device’s local records with the cloud copy?')){gate.style.display='none';cloudReady=true;await syncCloud();return}
    window.setCloudSnapshot(cloud.snapshot);
  }else{
    await api('/api/snapshot',{method:'PUT',body:JSON.stringify(window.getLocalSnapshot())});
  }
  cloudReady=true;gate.style.display='none';
  const email=session.data?.user?.email||session.user?.email||'Signed in';
  status.textContent='Cloud sync active · '+email;
}
submit.onclick=async()=>{
  submit.disabled=true;errorBox.textContent='';
  try{
    const email=document.getElementById('authEmail').value.trim(),password=document.getElementById('authPassword').value,name=document.getElementById('authName').value.trim();
    if(!email||!password)throw Error('Enter your email and password.');
    const result=creating?await auth.signUp.email({email,password,name:name||email.split('@')[0]}):await auth.signIn.email({email,password});
    if(result?.error)throw Error(result.error.message||'Authentication failed.');
    await enterApp();
  }catch(e){showError(e)}finally{submit.disabled=false}
};
toggle.onclick=()=>{creating=!creating;document.getElementById('authName').parentElement.style.display=creating?'block':'none';submit.textContent=creating?'Create account':'Sign in';toggle.textContent=creating?'I already have an account':'Create an account';document.getElementById('authPassword').autocomplete=creating?'new-password':'current-password';errorBox.textContent=''};
document.getElementById('authName').parentElement.style.display='none';
document.getElementById('authPassword').addEventListener('keydown',e=>{if(e.key==='Enter')submit.click()});
(async()=>{try{await enterApp()}catch(e){status.textContent='Sign in required';gate.style.display='flex';if(!/No active session/.test(e.message))showError(e)}})();
</script></body></html>
