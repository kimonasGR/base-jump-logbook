<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111218"><title>BASE Logbook</title>
<style>
:root{--bg:#101116;--panel:#191a22;--panel2:#20222d;--line:#30323e;--text:#f5f6fb;--muted:#9da2b4;--blue:#477ff5;--blue2:#263d72;--green:#55d69a;--red:#ff6b78;--radius:18px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #85a9ff;outline-offset:2px}.app{max-width:900px;margin:auto;min-height:100dvh;padding:0 16px 96px}.top{display:flex;align-items:center;justify-content:space-between;padding:24px 0 18px}.eyebrow{font-size:11px;letter-spacing:.16em;color:#a9b7dd;text-transform:uppercase}.brand{font-size:25px;font-weight:800;letter-spacing:-.04em}.brand span{color:#81a8ff}.iconbtn,.secondary,.primary,.danger{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:12px;padding:10px 13px}.primary{background:var(--blue);border-color:var(--blue);font-weight:700}.danger{color:#ffb5bb;border-color:#60343d;background:#2a1b21}.secondary{background:var(--panel)}.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.tabs{display:flex;gap:7px;overflow:auto;padding-bottom:16px}.tab{white-space:nowrap;border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--muted);padding:9px 14px}.tab.active{background:var(--blue2);border-color:#416ac5;color:white}.hero{border:1px solid #2b3d62;background:linear-gradient(125deg,#1b2438,#171922 68%);padding:20px;border-radius:22px;margin-bottom:18px}.hero h1{font-size:25px;margin:4px 0 6px;letter-spacing:-.04em}.muted{color:var(--muted)}.small{font-size:12px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:15px 0}.stat{background:#111722aa;border:1px solid #303b50;border-radius:14px;padding:12px}.stat b{display:block;font-size:22px}.stat span{font-size:11px;color:var(--muted)}.section{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:13px}.section h2{font-size:15px;margin:0 0 13px}.fieldgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{min-width:0}.field.full{grid-column:1/-1}label{display:block;font-size:12px;color:#c0c5d4;margin-bottom:6px}input,select,textarea{width:100%;background:#111219;border:1px solid #363844;border-radius:11px;color:var(--text);padding:11px 12px;min-height:43px}textarea{min-height:90px;resize:vertical}input::placeholder,textarea::placeholder{color:#696f80}.hidden{display:none!important}.pillrow{display:flex;flex-wrap:wrap;gap:7px}.pill{padding:8px 12px;border:1px solid var(--line);border-radius:999px;color:#c4c8d5;background:#111219}.pill.selected{background:var(--blue2);border-color:#5484e8;color:white}.formactions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.formactions button{flex:1}.searchrow{display:flex;gap:8px;margin-bottom:12px}.searchrow input{flex:1}.jump{border:1px solid var(--line);border-radius:15px;background:var(--panel);padding:14px;margin-bottom:9px}.jumphead{display:flex;justify-content:space-between;gap:10px}.number{color:#88aaff;font-weight:800}.jump h3{font-size:16px;margin:4px 0}.tag{display:inline-block;font-size:11px;border-radius:7px;background:#262b3b;color:#b9caff;padding:4px 7px;margin:4px 4px 0 0}.empty{text-align:center;padding:32px 15px;color:var(--muted)}.bottom{position:fixed;bottom:0;left:0;right:0;background:#121319ed;backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:10px max(14px,calc((100vw - 870px)/2)) calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:space-around;z-index:5}.bottom button{border:0;background:transparent;color:var(--muted);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 13px}.bottom button.active{color:#91b2ff}.bottom strong{font-size:19px;line-height:1}.mic{border:1px solid #395a9a;background:#1a2a49;color:#a9c5ff;border-radius:12px;padding:10px 12px;width:100%;text-align:left}.status{font-size:12px;color:var(--muted);margin-top:8px}.media-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}.media-grid img,.media-grid video{width:100%;height:100px;object-fit:cover;border-radius:10px;background:#0a0b0e}.note{background:#202131;border-radius:10px;padding:10px;color:#c7d4f7;font-size:12px}.divider{height:1px;background:var(--line);margin:14px 0}.settingsrow{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);gap:15px}.settingsrow:last-child{border-bottom:0}.coord{display:grid;grid-template-columns:1fr 1fr;gap:8px}.footerhint{font-size:11px;color:var(--muted);margin-top:8px}
@media(max-width:560px){.app{padding:0 12px 100px}.top{padding-top:18px}.fieldgrid{grid-template-columns:1fr}.field.full{grid-column:auto}.hero{padding:17px}.hero h1{font-size:23px}.stats{gap:6px}.stat{padding:10px}.stat b{font-size:19px}.section{padding:14px}.jumphead{align-items:flex-start}}
</style></head><body>
<div class="app">
<header class="top"><div><div class="eyebrow">PERSONAL JUMP RECORDS</div><div class="brand">BASE <span>LOGBOOK</span></div></div><button class="iconbtn" id="settingsTop" aria-label="Settings">⚙</button></header>
<div id="authStatus" class="muted small" style="margin:-10px 0 14px">Cloud account: checking…</div>
<div class="tabs" id="tabs"><button class="tab active" data-view="logbook">Logbook</button><button class="tab" data-view="objects">Objects</button><button class="tab" data-view="gear">Gear presets</button><button class="tab" data-view="settings">Settings</button></div>
<main id="main"></main>
</div>
<nav class="bottom"><button class="active" data-view="logbook"><strong>▤</strong>Logbook</button><button data-view="objects"><strong>⌖</strong>Objects</button><button data-view="gear"><strong>♧</strong>Gear</button><button data-view="settings"><strong>⚙</strong>Settings</button></nav>
<script>
const KEY='baseLogbookMvp.v1';
const defaults={jumps:[],objects:[],gears:[],options:{'Slider Configuration':['Slider up','Slider down','Slider off','Slick terminal'],'Pilot Chute':['42 inch','36 inch','38 inch'],'Suit':['Wingsuit','Track suit','No suit'],'Rig':[],'Jump Type':['Standard','Wingsuit','Tracking','Tandem','Other'],'Exit manoeuvre':['Stable','Front flip','Back flip','Other'],'Deployment Method':['Stowed','Hand-held','PCA','Static line','Direct bag'],'Wind strength':['Calm','Light','Moderate','Strong']},settings:{heightUnit:'m',windUnit:'m/s',timeZone:'local'}};
let db=load(),view='logbook',editing=null,objectEditing=null,gearEditing=null,query='',filterCountry='',filterType='',filterSuit='',mediaDraft=[];
function load(){try{return {...structuredClone(defaults),...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{return structuredClone(defaults)}}function persist(){localStorage.setItem(KEY,JSON.stringify(db));window.cloudSync?.()}function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function uid(){return crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random())}function nowDate(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}function options(name){const fixed={objectType:['B','A','S','E','Other'],yesNo:['Yes','No'],yesNoNa:['Yes','No','N/A'],openingDirection:['0°','45° Left','45° Right','90° Left','90° Right','135° Left','135° Right','180°'],skyCover:['Clear','Cloudy','Precipitation','Fog'],lighting:['Sun','Shade','Night']};return fixed[name]||db.options[name]||[]}function opts(name,selected='',includeBlank=true){return (includeBlank?'<option value="">Select…</option>':'')+options(name).map(v=>`<option ${v===selected?'selected':''} value="${esc(v)}">${esc(v)}</option>`).join('')}
function field(label,name,value='',type='text',extra=''){return `<div class="field ${extra}"><label for="${name}">${label}</label><input id="${name}" name="${name}" type="${type}" value="${esc(value??'')}" /></div>`}function selectField(label,name,value='',listName=name,extra=''){return `<div class="field ${extra}"><label for="${name}">${label}</label><select id="${name}" name="${name}">${opts(listName,value)}</select></div>`}function area(label,name,value='',extra=''){return `<div class="field ${extra}"><label for="${name}">${label}</label><textarea id="${name}" name="${name}" placeholder="Optional">${esc(value||'')}</textarea></div>`}function pillGroup(label,name,values,selected){return `<div class="field full"><label>${label}</label><div class="pillrow" data-pills="${name}">${values.map(v=>`<button type="button" class="pill ${selected===v?'selected':''}" data-value="${esc(v)}">${esc(v)}</button>`).join('')}</div><input type="hidden" name="${name}" value="${esc(selected||'')}" /></div>`}
function header(title,desc,button=''){return `<div class="row between" style="margin:4px 0 14px"><div><div class="eyebrow">BASE JUMP LOGBOOK</div><h1 style="font-size:24px;margin:3px 0">${title}</h1><div class="muted small">${desc}</div></div>${button}</div>`}
function render(){document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));document.getElementById('main').innerHTML=view==='logbook'?renderLogbook():view==='objects'?renderObjects():view==='gear'?renderGear():renderSettings();bindView()}
function renderLogbook(){let total=db.jumps.length,countries=new Set(db.jumps.map(j=>j.country).filter(Boolean)).size,objects=new Set(db.jumps.map(j=>j.objectId||j.objectName).filter(Boolean)).size;let jumps=db.jumps.filter(j=>{let hay=Object.values(j).join(' ').toLowerCase();return (!query||hay.includes(query.toLowerCase()))&&(!filterCountry||j.country===filterCountry)&&(!filterType||j.objectType===filterType)&&(!filterSuit||j.suit===filterSuit)}).sort((a,b)=>(b.date||'').localeCompare(a.date||'')||b.number-a.number);return `<section class="hero"><div class="eyebrow">YOUR PERSONAL LOG</div><h1>Every jump. Every detail.</h1><div class="muted">A private, searchable record of your exits, equipment and conditions.</div><div class="stats"><div class="stat"><b>${total}</b><span>TOTAL JUMPS</span></div><div class="stat"><b>${objects}</b><span>OBJECTS</span></div><div class="stat"><b>${countries}</b><span>COUNTRIES</span></div></div><button class="primary" id="newJump">＋ Log a jump</button> <button class="secondary" id="voiceJump">🎙 Log by voice</button></section><div class="searchrow"><input id="search" placeholder="Search jumps, objects, gear…" value="${esc(query)}"><button class="secondary" id="clearFilters">Filters ↺</button></div><div class="fieldgrid" style="margin-bottom:12px"><div class="field"><select id="countryFilter"><option value="">All countries</option>${[...new Set(db.jumps.map(j=>j.country).filter(Boolean))].sort().map(c=>`<option ${filterCountry===c?'selected':''}>${esc(c)}</option>`).join('')}</select></div><div class="field"><select id="typeFilter"><option value="">All object types</option>${['B','A','S','E','Other'].map(c=>`<option ${filterType===c?'selected':''}>${c}</option>`).join('')}</select></div></div>${jumps.length?jumps.map(j=>`<article class="jump"><div class="jumphead"><div><div class="number">JUMP #${j.number}</div><h3>${esc(j.objectName||'Unnamed object')}</h3><div class="muted small">${esc([j.country,j.date,j.time].filter(Boolean).join(' · '))}</div></div><button class="secondary" data-edit-jump="${j.id}">Open ↗</button></div><div>${[j.objectType,j.jumpType,j.suit,j.height?j.height+' '+(j.heightUnit||db.settings.heightUnit):''].filter(Boolean).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>${j.privateNotes?`<div class="muted small" style="margin-top:9px">${esc(j.privateNotes.slice(0,150))}${j.privateNotes.length>150?'…':''}</div>`:''}</article>`).join(''):`<div class="section empty"><div style="font-size:28px">⌁</div><b>${total?'No matching jumps':'Your logbook starts here'}</b><p>${total?'Try changing your search or filters.':'Add your first jump or use voice logging to populate a draft.'}</p><button class="primary" id="emptyNew">＋ Log first jump</button></div>`}<div class="footerhint">Your records sync to your private cloud account. Photos, videos and FlySight files currently remain on this device; include them in regular local backups.</div>`}
function jumpForm(j={}){editing=j.id||null;mediaDraft=[...(j.media||[])];let selectedObject=db.objects.find(o=>o.id===j.objectId);return `${header(j.id?'Edit jump':'Log a jump','Fields marked with * are required.','<button class="secondary" id="cancelForm">Cancel</button>')}<form id="jumpForm"><section class="section"><h2>01 · Where & when</h2><div class="fieldgrid">${field('Jump Number','number',j.number??(Math.max(0,...db.jumps.map(x=>x.number||0))+1),'number')}${field('Object name or location *','objectName',j.objectName||selectedObject?.name||'')}${field('Country','country',j.country||selectedObject?.country||'')}${field('Date','date',j.date||nowDate(),'date')}${field('Time','time',j.time||new Date().toTimeString().slice(0,5),'time')}${field('Height','height',j.height||selectedObject?.height||'','number')}${selectField('Object type *','objectType',j.objectType||selectedObject?.type||'','objectType')}${`<div class="field"><label for="heightUnit">Height unit</label><select id="heightUnit" name="heightUnit"><option value="m" ${(j.heightUnit||db.settings.heightUnit)==='m'?'selected':''}>Metres (m)</option><option value="ft" ${(j.heightUnit||db.settings.heightUnit)==='ft'?'selected':''}>Feet (ft)</option></select></div>`}<div class="field full ${j.objectType==='Other'?'':'hidden'}" id="otherTypeWrap"><label for="otherType">Specify object type *</label><input id="otherType" name="otherType" value="${esc(j.otherType||'')}" placeholder="Describe the object type"></div><div class="field full"><label>Coordinates</label><div class="coord"><input aria-label="Latitude" id="latitude" name="latitude" placeholder="Latitude" type="number" step="any" value="${esc(j.latitude??selectedObject?.latitude??'')}"><input aria-label="Longitude" id="longitude" name="longitude" placeholder="Longitude" type="number" step="any" value="${esc(j.longitude??selectedObject?.longitude??'')}"></div><div class="formactions"><button type="button" class="secondary" id="gps">◎ Use current GPS</button><button type="button" class="secondary" id="copyObject">Use saved object</button></div><div class="footerhint">Decimal degrees. GPS requires location permission and may be unavailable indoors.</div></div><div class="field full"><label for="savedObject">Select existing object (optional)</label><select id="savedObject" name="savedObject"><option value="">Choose an existing object…</option>${db.objects.map(o=>`<option value="${o.id}" ${j.objectId===o.id?'selected':''}>${esc(o.name)} · ${esc(o.country||'Country unknown')}</option>`).join('')}</select></div></div></section>
<section class="section"><h2>02 · Jump configuration</h2><div class="fieldgrid">${selectField('Slider Configuration','sliderConfiguration',j.sliderConfiguration)}${selectField('Pilot Chute','pilotChute',j.pilotChute)}${selectField('Suit','suit',j.suit)}${selectField('Summit + OSP?','summitOsp',j.summitOsp,'yesNo')}${selectField('Rig','rig',j.rig)}${selectField('Jump Type','jumpType',j.jumpType)}${selectField('Exit manoeuvre','exitManoeuvre',j.exitManoeuvre)}${selectField('Deployment method','deploymentMethod',j.deploymentMethod)}</div></section>
<section class="section"><h2>03 · Flight & deployment</h2><div class="fieldgrid">${field('Wind strength','windStrength',j.windStrength||'')}${field('Wind direction','windDirection',j.windDirection||'')}${field('Delay (seconds)','delay',j.delay||'','number')}${field('Delay for SU (seconds)','delaySu',j.delaySu||'','number')}${selectField('Opening direction','openingDirection',j.openingDirection,'openingDirection')}${selectField('Off Heading?','offHeading',j.offHeading,'yesNo')}${selectField('Correction?','correction',j.correction,'yesNoNa')}${field('Brake Setting','brakeSetting',j.brakeSetting||'')}</div></section>
<section class="section"><h2>04 · Conditions</h2><div class="fieldgrid">${selectField('Sky cover','skyCover',j.skyCover,'skyCover')}${selectField('Lighting','lighting',j.lighting,'lighting')}</div></section>
<section class="section"><h2>05 · Private notes</h2><div class="fieldgrid">${area('Private notes','privateNotes',j.privateNotes,'full')}${field('Beautiful people around','beautifulPeople',j.beautifulPeople||'','text','full')}</div><div class="divider"></div><button type="button" class="primary" id="voiceJumpForm">🎙 Record jump details with AI</button><button type="button" class="mic" id="dictateNotes">🎙 Dictate private notes</button><div class="status" id="voiceStatus">Voice recognition depends on browser and language support. Review transcription before saving.</div></section>
<section class="section"><h2>06 · Photos, videos & track</h2><div class="field"><label for="mediaFiles">Attach photos/videos</label><input id="mediaFiles" type="file" accept="image/*,video/*" multiple><div class="footerhint">For this prototype, media is stored locally with the record; large files may exceed browser storage limits.</div></div><div class="media-grid" id="mediaGrid">${mediaDraft.map((m,i)=>m.data?`<div><img src="${m.data}" alt="Attachment ${i+1}"><button type="button" class="danger" data-remove-media="${i}">Remove</button></div>`:`<div class="note">${esc(m.name)}</div>`).join('')}</div><div class="field" style="margin-top:12px"><label for="flySight">FlySight track file</label><input id="flySight" type="file" accept=".gpx,.csv,.igc,.kml,.txt"><div class="footerhint">Track attachment only in this prototype; track visualization can be added next.</div><div id="trackName" class="small muted">${esc(j.trackName||'')}</div></div></section><div class="formactions"><button class="primary" type="submit">Save jump</button><button class="secondary" type="button" id="cancelBottom">Cancel</button></div>${j.id?'<button class="danger" type="button" style="width:100%;margin-top:10px" id="deleteJump">Delete jump permanently</button>':''}</form>`}
function renderObjects(){return `${header('Objects','Objects are added automatically when you save a jump. Select an existing object inside a new jump to reuse it.')}${db.objects.length?db.objects.map(o=>`<article class="jump"><div class="jumphead"><div><div class="number">${esc(o.type==='Other'?o.otherType:o.type||'Object')}</div><h3>${esc(o.name)}</h3><div class="muted small">${esc([o.country,o.height?o.height+' '+(o.heightUnit||db.settings.heightUnit):'',o.latitude&&o.longitude?`${o.latitude}, ${o.longitude}`:''].filter(Boolean).join(' · '))}</div></div></div><div class="formactions"><button class="secondary" data-use-object="${o.id}">Log jump here</button></div></article>`).join(''):'<div class="section empty">No objects yet. Save your first jump and its object will appear here automatically.</div>'}`}
function objectForm(o={}){return `<section class="section"><h2>${o.id?'Edit object':'New saved object'}</h2><form id="objectForm"><div class="fieldgrid">${field('Object name *','name',o.name||'')}${field('Country','country',o.country||'')}${selectField('Object type *','type',o.type,'objectType')}${field('Height','height',o.height||'','number')}${`<div class="field"><label>Height unit</label><select name="heightUnit"><option value="m" ${(o.heightUnit||db.settings.heightUnit)==='m'?'selected':''}>Metres</option><option value="ft" ${(o.heightUnit||db.settings.heightUnit)==='ft'?'selected':''}>Feet</option></select></div>`}<div class="field full ${o.type==='Other'?'':'hidden'}" id="objOtherWrap"><label>Specify object type *</label><input name="otherType" value="${esc(o.otherType||'')}"></div><div class="field full"><label>Coordinates</label><div class="coord"><input name="latitude" type="number" step="any" placeholder="Latitude" value="${esc(o.latitude??'')}"><input name="longitude" type="number" step="any" placeholder="Longitude" value="${esc(o.longitude??'')}"></div><button type="button" class="secondary" style="margin-top:8px" id="objGps">◎ Use current GPS</button></div></div><div class="formactions"><button class="primary">Save object</button><button class="secondary" type="button" id="cancelObject">Cancel</button></div></form></section>`}
function renderGear(){return `${header('Gear presets','Save reusable configurations to speed up logging.','<button class="primary" id="newGear">＋ Add preset</button>')}${gearEditing!==null?gearForm(db.gears.find(g=>g.id===gearEditing)||{}):''}${db.gears.length?db.gears.map(g=>`<article class="jump"><div class="jumphead"><div><div class="number">GEAR PRESET</div><h3>${esc(g.name)}</h3><div class="muted small">${esc([g.rig,g.suit,g.pilotChute,g.sliderConfiguration].filter(Boolean).join(' · '))}</div></div><button class="secondary" data-edit-gear="${g.id}">Edit</button></div><div class="formactions"><button class="secondary" data-apply-gear="${g.id}">Use in new jump</button><button class="danger" data-delete-gear="${g.id}">Delete</button></div></article>`).join(''):'<div class="section empty">No gear presets yet. Create one for equipment you use regularly.</div>'}`}
function gearForm(g={}){return `<section class="section"><h2>${g.id?'Edit preset':'New gear preset'}</h2><form id="gearForm"><div class="fieldgrid">${field('Preset name *','name',g.name||'')}${selectField('Rig','rig',g.rig)}${selectField('Suit','suit',g.suit)}${selectField('Pilot Chute','pilotChute',g.pilotChute)}${selectField('Slider Configuration','sliderConfiguration',g.sliderConfiguration)}</div><div class="formactions"><button class="primary">Save preset</button><button class="secondary" type="button" id="cancelGear">Cancel</button></div></form></section>`}
function renderSettings(){return `${header('Settings','Personalize the logbook and protect your data.')}<section class="section"><h2>Units & time</h2><div class="settingsrow"><div><b>Height unit</b><div class="muted small">Used for new records and objects</div></div><select id="settingHeight" style="width:130px"><option value="m" ${db.settings.heightUnit==='m'?'selected':''}>Metres</option><option value="ft" ${db.settings.heightUnit==='ft'?'selected':''}>Feet</option></select></div><div class="settingsrow"><div><b>Wind unit</b><div class="muted small">Preferred display unit</div></div><select id="settingWind" style="width:130px"><option value="m/s" ${db.settings.windUnit==='m/s'?'selected':''}>m/s</option><option value="km/h" ${db.settings.windUnit==='km/h'?'selected':''}>km/h</option><option value="knots" ${db.settings.windUnit==='knots'?'selected':''}>knots</option></select></div><div class="settingsrow"><div><b>Time zone</b><div class="muted small">Jump times are stored as entered with local context</div></div><select id="settingZone" style="width:150px"><option value="local" ${db.settings.timeZone==='local'?'selected':''}>Device local</option><option value="utc" ${db.settings.timeZone==='utc'?'selected':''}>UTC</option></select></div></section><section class="section"><h2>Custom dropdown options</h2><div class="field"><label for="optionField">Choose field</label><select id="optionField">${['Slider Configuration','Pilot Chute','Suit','Rig','Jump Type','Exit manoeuvre','Deployment Method','Wind strength'].map(n=>`<option>${n}</option>`).join('')}</select></div><div class="field" style="margin-top:10px"><label for="optionNew">Add option</label><div class="row"><input id="optionNew" placeholder="Enter new option"><button class="primary" id="addOption">Add</button></div></div><div id="optionList" style="margin-top:10px"></div></section><section class="section"><h2>Data protection & backup</h2><div class="note">Jumps, objects, gear presets and settings sync to your pr function startDictation(target,status){let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){status.textContent='Speech recognition is not supported in this browser. Try a supported browser or use the keyboard microphone.';return}let rec=new SR();rec.interimResults=true;rec.continuous=false;rec.lang=navigator.language||'en-US';status.textContent='Listening… speak now.';rec.onresult=e=>{let text=Array.from(e.results).map(r=>r[0].transcript).join('');target.value=(target.value?target.value+' ':'')+text};rec.onerror=e=>status.textContent='Voice recognition error: '+e.error;rec.onend=()=>{if(status)status.textContent='Transcription ready. Review and edit before saving.'};rec.start()}
let activeVoiceRecorder=null,voiceChunks=[];
async function startVoiceAll(){
 const f=document.getElementById('jumpForm'),status=document.getElementById('voiceStatus');
 if(!f)return;
 if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){status.textContent='Audio recording is not supported here. Use the microphone on your keyboard in Private Notes.';return}
 if(!window.extractVoiceAudio){status.textContent='Sign in to enable AI voice extraction.';return}
 try{
  const stream=await navigator.mediaDevices.getUserMedia({audio:true});
  const mime=['audio/webm;codecs=opus','audio/webm','audio/mp4'].find(t=>MediaRecorder.isTypeSupported(t));
  activeVoiceRecorder=new MediaRecorder(stream,mime?{mimeType:mime}:{});
  voiceChunks=[];
  activeVoiceRecorder.ondataavailable=e=>{if(e.data.size)voiceChunks.push(e.data)};
  activeVoiceRecorder.onerror=()=>{status.textContent='Recording failed. No data was saved.';stream.getTracks().forEach(t=>t.stop())};
  activeVoiceRecorder.onstop=async()=>{
   stream.getTracks().forEach(t=>t.stop());
   const blob=new Blob(voiceChunks,{type:(activeVoiceRecorder.mimeType||'audio/webm').startsWith('audio/mp4')?'audio/mp4':'audio/webm'});
   activeVoiceRecorder=null;
   if(!blob.size){status.textContent='No audio captured.';return}
   status.textContent='Transcribing and extracting a draft…';
   try{
    const result=await window.extractVoiceAudio(blob);
    const draft=result.draft||{};
    const map={object_name:'objectName',country:'country',latitude:'latitude',longitude:'longitude',height_m:'height',object_type:'objectType',object_type_other:'otherType',date_time:'',slider_configuration:'sliderConfiguration',pilot_chute:'pilotChute',suit:'suit',summit_osp:'summitOsp',rig:'rig',jump_type:'jumpType',wind_strength:'windStrength',wind_direction:'windDirection',delay_seconds:'delay',delay_for_su_seconds:'delaySu',exit_manoeuvre:'exitManoeuvre',off_heading:'offHeading',correction:'correction',brake_setting:'brakeSetting',beautiful_people_around:'beautifulPeople',private_notes:'privateNotes',deployment_method:'deploymentMethod',opening_direction_degrees:'openingDirection'};
    const uncertain=[];
    for(const [key,name] of Object.entries(map)){
     const value=draft[key]; if(!name||value===null||value===undefined||value==='')continue;
     const el=f.elements[name];if(!el)continue;
     let display=value;
     if(key==='off_heading'||key==='correction')display=value?'Yes':'No';
     if(el.tagName==='SELECT'&&![...el.options].some(o=>o.value===String(display)))el.add(new Option(String(display),String(display)));
     el.value=String(display);
    }
    if(typeof draft.opening_direction_degrees==='number'){
     const side=draft.opening_direction_side==='L'?' Left':draft.opening_direction_side==='R'?' Right':'';
     const direction=String(draft.opening_direction_degrees)+'°'+side;
     const el=f.elements.openingDirection;if(el){if(![...el.options].some(o=>o.value===direction))el.add(new Option(direction,direction));el.value=direction}
    }
    if(draft.date_time){const dt=new Date(draft.date_time);if(!Number.isNaN(dt.getTime())){f.elements.date.value=dt.toISOString().slice(0,10);f.elements.time.value=dt.toTimeString().slice(0,5)}}
    if(draft.height_m!==null&&draft.height_m!==undefined&&f.elements.heightUnit.value==='ft'&&f.elements.height.value)f.elements.height.value=String(Math.round(Number(draft.height_m)*3.28084));
    if(draft.wind_strength!==null&&draft.wind_strength!==undefined)f.elements.windStrength.value=String(draft.wind_strength);
    if(draft.transcript)f.elements.privateNotes.value=[f.elements.privateNotes.value,draft.transcript].filter(Boolean).join('\n\n');
    document.getElementById('otherTypeWrap').classList.toggle('hidden',f.elements.objectType.value!=='Other');
    uncertain.push(...(draft.uncertain_fields||[]));
    const filled=Object.entries(map).filter(([k,n])=>n&&draft[k]!==null&&draft[k]!==undefined&&draft[k]!=='').length;
    status.textContent='AI draft ready · '+filled+' fields suggested'+(uncertain.length?' · Review uncertain: '+uncertain.join(', '):'')+'. Nothing has been saved. Check every field before saving.';const voiceButton=document.getElementById('voiceJumpForm');if(voiceButton){voiceButton.textContent='🎙 Record jump details with AI';voiceButton.classList.remove('danger');voiceButton.onclick=startVoiceAll}
    f.scrollIntoView({behavior:'smooth',block:'start'});
   }catch(e){status.textContent='AI extraction failed: '+e.message+'. No jump was saved.'}
  };
  activeVoiceRecorder.start();status.textContent='Recording… speak the jump details naturally. Press Stop when finished.';
  const stop=document.getElementById('voiceJumpForm');if(stop){stop.textContent='Stop recording';stop.classList.add('danger');stop.onclick=()=>{if(activeVoiceRecorder?.state==='recording'){activeVoiceRecorder.stop();stop.textContent='🎙 Record jump details with AI';stop.classList.remove('danger');stop.onclick=startVoiceAll}}}
 }catch(e){status.textContent='Microphone unavailable: '+e.message}
}
render();

<script type="module">

async function api(path,opts={}){
  const response=await fetch(path,{...opts,headers:{'Content-Type':'application/json',Authorization:'Bearer '+bearer,...opts.headers}});
  const data=await response.json().catch(()=>({}));
  if(!response.ok)throw Error(data.error||'Cloud request failed ('+response.status+').');

async function syncCloud(){
  if(!cloudReady||!bearer)return;
  if(syncBusy){syncAgain=true;return}
  syncBusy=true;
  try{
    const snapshot=window.getLocalSnapshot();
    const result=await api('/api/snapshot',{method:'PUT',body:JSON.stringify({...snapshot,expectedUpdatedAt:cloudUpdatedAt})});
    cloudUpdatedAt=result.updatedAt;
    status.textContent='Cloud sync active · '+new Date().toLocaleTimeString();
  }catch(e){if(/Cloud data changed on another device|SNAPSHOT_CONFLICT/.test(e.message)){cloudReady=false;syncAgain=false;status.textContent='Sync paused: cloud changed on another device. Export this device’s backup before resolving the conflict.'}else status.textContent='Cloud sync issue · '+e.message}
  finally{syncBusy=false;if(syncAgain){syncAgain=false;syncCloud()}}
}
window.cloudSync=()=>{if(cloudReady)syncCloud()};
window.signOutLogbook=async()=>{try{await auth.signOut();cloudReady=false;bearer=null;cloudUpdatedAt=null;gate.style.display='flex';status.textContent='Signed out';errorBox.textContent='';}catch(e){showError(e)}};
async function enterApp(){
  const session=await auth.getSession();
  if(!session?.data?.user&&!session?.user)throw Error('No active session.');
  bearer=await getToken();
  await api('/api/me');
  const cloud=await api('/api/snapshot');
  cloudUpdatedAt=cloud.updatedAt||null;
  if(cloud.snapshot){
    const local=window.getLocalSnapshot();
    const localHasData=local.jumps.length||local.objects.length||local.gears.length;
    if(localHasData&&!confirm('A cloud logbook already exists. Load the cloud copy on this device? Your current local records will be replaced. Export a local backup first if you need to keep them.'))throw Error('Cloud data was not loaded. Your local data has not been uploaded or overwritten. Export a backup, then choose Sign in again to load the cloud copy.');
    window.setCloudSnapshot(cloud.snapshot);
  }else{
    const initial=await api('/api/snapshot',{method:'PUT',body:JSON.stringify({...window.getLocalSnapshot(),expectedUpdatedAt:null})});
    cloudUpdatedAt=initial.updatedAt;
  }
  cloudReady=true;gate.style.display='none';
  const email=session.data?.user?.email||session.user?.email||'Signed in';
  status.textContent='Cloud sync active · '+email;
}
submit.onclick=async()=>{
  submit.disabled=true;errorBox.textContent='';
  try{
    const email=document.getElementById('authEmail').value.trim(),password=document.getElementById('authPassword').value,name=document.getElementById('authName').value.trim();
    if(!email||!password)throw Error('Enter your email and password.');
    const result=creating?await auth.signUp.email({email,password,name:name||email.split('@')[0]}):await auth.signIn.email({email,password});
    if(result?.error)throw Error(result.error.message||'Authentication failed.');
    await enterApp();
  }catch(e){showError(e)}finally{submit.disabled=false}
};
toggle.onclick=()=>{creating=!creating;document.getElementById('authName').parentElement.style.display=creating?'block':'none';submit.textContent=creating?'Create account':'Sign in';toggle.textContent=creating?'I already have an account':'Create an account';document.getElementById('authPassword').autocomplete=creating?'new-password':'current-password';errorBox.textContent=''};
document.getElementById('authName').parentElement.style.display='none';
document.getElementById('authPassword').addEventListener('keydown',e=>{if(e.key==='Enter')submit.click()});
(async()=>{try{await enterApp()}catch(e){status.textContent='Sign in required';gate.style.display='flex';if(!/No active session/.test(e.message))showError(e)}})();
</script></body></html>
